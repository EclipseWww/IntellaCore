<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }
    canvas {
      border: 3px solid #4d5bf9;
      border-radius: 10px;
      background-color: #000;
      display: block;
      margin: 0 auto;
      box-shadow: 0 0 20px rgba(77, 91, 249, 0.5);
      outline: none; /* 去除焦点时的轮廓线 */
    }
    .score-container {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 24px;
      background: linear-gradient(90deg, rgba(77, 91, 249, 0.8) 0%, rgba(30, 144, 255, 0.8) 100%);
      padding: 10px 20px;
      border-radius: 30px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }
    .score-container:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
    }
    .controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: white;
      font-size: 16px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 20px;
      border-radius: 30px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    .game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      color: white;
      display: none;
      box-shadow: 0 0 30px rgba(255, 77, 79, 0.6);
    }
    .game-over h2 {
      font-size: 36px;
      margin-bottom: 15px;
      color: #ff4d4f;
    }
    .game-over p {
      font-size: 20px;
      margin-bottom: 20px;
    }
    .restart-btn {
      background: linear-gradient(90deg, #4d5bf9 0%, #1890ff 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .restart-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(77, 91, 249, 0.5);
    }
    .game-start-tip {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.7);
      padding: 20px 30px;
      border-radius: 15px;
      text-align: center;
      color: white;
      box-shadow: 0 0 20px rgba(77, 91, 249, 0.6);
      animation: fadeOut 3s forwards;
      pointer-events: none;
    }
    .game-start-tip h3 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #4d5bf9;
    }
    .game-start-tip p {
      font-size: 18px;
      margin-bottom: 5px;
    }
    @keyframes fadeOut {
      0% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="640" height="480"></canvas>
  <div class="score-container">得分: <span id="score">0</span></div>
  <div class="controls">方向键或WASD控制移动</div>
  <div class="game-over" id="gameOverScreen">
    <h2>游戏结束!</h2>
    <p>你的最终得分: <span id="finalScore">0</span></p>
    <button class="restart-btn" id="restartBtn">重新开始</button>
  </div>
  <div class="game-start-tip" id="gameStartTip">
    <h3>准备开始!</h3>
    <p>使用方向键或WASD控制移动</p>
    <p>吃到食物增加得分</p>
  </div>

  <script>
    // 获取画布和上下文
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const finalScoreElement = document.getElementById('finalScore');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const restartBtn = document.getElementById('restartBtn');
    
    // 游戏变量
    const tileSize = 20;
    const tileCountX = canvas.width / tileSize;
    const tileCountY = canvas.height / tileSize;
    
    // 颜色配置
    const colors = {
      background: '#0a0a23',
      snake: {
        body: ['#4d5bf9', '#1890ff', '#36cfc9'],
        head: '#722ed1',
        border: '#003eb3'
      },
      food: {
        fill: '#ff4d4f',
        border: '#a8071a',
        glow: 'rgba(255, 77, 79, 0.6)'
      }
    };
    
    let score = 0;
    let highScore = localStorage.getItem('snakeHighScore') || 0;
    let speed = 10;
    let snake = [
      { x: 10, y: 10 }
    ];
    let food = {
      x: 15,
      y: 15
    };
    let velocityX = 1;  // 默认向右移动
    let velocityY = 0;
    let gameOver = false;
    let lastTime = 0;
    let accumulator = 0;
    let foodAnimAngle = 0;
    
    // 随机生成食物位置
    function placeFood() {
      let foodPlaced = false;
      let maxAttempts = 100;  // 设置最大尝试次数，避免无限循环
      let attempts = 0;
      
      while (!foodPlaced && attempts < maxAttempts) {
        attempts++;
        
        // 随机生成位置
        const x = Math.floor(Math.random() * tileCountX);
        const y = Math.floor(Math.random() * tileCountY);
        
        // 检查是否与蛇身重叠
        let overlap = false;
        for (let i = 0; i < snake.length; i++) {
          if (x === snake[i].x && y === snake[i].y) {
            overlap = true;
            break;
          }
        }
        
        // 如果没有重叠，则放置食物
        if (!overlap) {
          food.x = x;
          food.y = y;
          foodPlaced = true;
        }
      }
      
      // 如果尝试了最大次数仍未找到位置，则在随机位置放置
      if (!foodPlaced) {
        food.x = Math.floor(Math.random() * tileCountX);
        food.y = Math.floor(Math.random() * tileCountY);
      }
    }
    
    // 处理游戏逻辑
    function update() {
      // 移动蛇
      const head = { x: snake[0].x + velocityX, y: snake[0].y + velocityY };
      
      // 碰撞检测 - 墙壁
      if (head.x < 0 || head.x >= tileCountX || head.y < 0 || head.y >= tileCountY) {
        handleGameOver();
        return;
      }
      
      // 碰撞检测 - 自身
      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          handleGameOver();
          return;
        }
      }
      
      // 添加新的头部
      snake.unshift(head);
      
      // 检查是否吃到食物
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreElement.textContent = score;
        
        // 播放吃到食物的音效
        playEatSound();
        
        // 为得分添加动画效果
        animateScore();
        
        placeFood();
        
        // 增加速度
        if (score % 50 === 0 && speed < 20) {
          speed++;
        }
      } else {
        // 如果没有吃到食物，移除尾部
        snake.pop();
      }
      
      // 更新食物动画
      foodAnimAngle += 0.1;
    }
    
    // 处理游戏结束
    function handleGameOver() {
      gameOver = true;
      
      // 更新最高分
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snakeHighScore', highScore);
      }
      
      // 显示游戏结束界面
      finalScoreElement.textContent = score;
      gameOverScreen.style.display = 'block';
    }
    
    // 播放吃到食物的音效
    function playEatSound() {
      // 创建音频上下文
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      // 创建振荡器
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      // 设置音频参数
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
      oscillator.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.2); // A4
      
      gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      
      // 连接节点
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      // 播放声音
      oscillator.start();
      oscillator.stop(audioCtx.currentTime + 0.2);
    }
    
    // 为得分添加动画效果
    function animateScore() {
      const scoreContainer = document.querySelector('.score-container');
      scoreContainer.style.transform = 'scale(1.2)';
      setTimeout(() => {
        scoreContainer.style.transform = 'scale(1)';
      }, 200);
    }
    
    // 绘制游戏
    function draw() {
      // 清空画布
      ctx.fillStyle = colors.background;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // 绘制网格背景
      drawGrid();
      
      // 绘制蛇
      for (let i = 0; i < snake.length; i++) {
        const colorIndex = i % colors.snake.body.length;
        
        // 创建渐变色彩
        const gradient = ctx.createLinearGradient(
          snake[i].x * tileSize, 
          snake[i].y * tileSize, 
          snake[i].x * tileSize + tileSize, 
          snake[i].y * tileSize + tileSize
        );
        gradient.addColorStop(0, colors.snake.body[colorIndex]);
        gradient.addColorStop(1, shadeColor(colors.snake.body[colorIndex], -20));
        
        ctx.fillStyle = gradient;
        
        // 绘制圆角矩形
        roundRect(
          ctx,
          snake[i].x * tileSize + 1, 
          snake[i].y * tileSize + 1, 
          tileSize - 2, 
          tileSize - 2, 
          5
        );
        
        // 绘制边框
        ctx.strokeStyle = colors.snake.border;
        ctx.lineWidth = 1;
        roundRect(
          ctx,
          snake[i].x * tileSize + 1, 
          snake[i].y * tileSize + 1, 
          tileSize - 2, 
          tileSize - 2, 
          5,
          false,
          true
        );
      }
      
      // 绘制蛇头
      if (snake.length > 0) {
        ctx.fillStyle = colors.snake.head;
        roundRect(
          ctx,
          snake[0].x * tileSize, 
          snake[0].y * tileSize, 
          tileSize, 
          tileSize, 
          6
        );
        
        // 绘制眼睛
        ctx.fillStyle = 'white';
        
        // 根据方向绘制眼睛
        const eyeSize = 4;
        const eyeOffset = 4;
        
        // 左眼
        let leftEyeX = snake[0].x * tileSize + eyeOffset;
        let leftEyeY = snake[0].y * tileSize + eyeOffset;
        
        // 右眼
        let rightEyeX = snake[0].x * tileSize + tileSize - eyeOffset - eyeSize;
        let rightEyeY = snake[0].y * tileSize + eyeOffset;
        
        // 根据方向调整眼睛位置
        if (velocityY < 0) { // 向上
          leftEyeX = snake[0].x * tileSize + eyeOffset;
          rightEyeX = snake[0].x * tileSize + tileSize - eyeOffset - eyeSize;
          leftEyeY = rightEyeY = snake[0].y * tileSize + eyeOffset;
        } else if (velocityY > 0) { // 向下
          leftEyeX = snake[0].x * tileSize + eyeOffset;
          rightEyeX = snake[0].x * tileSize + tileSize - eyeOffset - eyeSize;
          leftEyeY = rightEyeY = snake[0].y * tileSize + tileSize - eyeOffset - eyeSize;
        } else if (velocityX < 0) { // 向左
          leftEyeX = rightEyeX = snake[0].x * tileSize + eyeOffset;
          leftEyeY = snake[0].y * tileSize + eyeOffset;
          rightEyeY = snake[0].y * tileSize + tileSize - eyeOffset - eyeSize;
        } else if (velocityX > 0) { // 向右
          leftEyeX = rightEyeX = snake[0].x * tileSize + tileSize - eyeOffset - eyeSize;
          leftEyeY = snake[0].y * tileSize + eyeOffset;
          rightEyeY = snake[0].y * tileSize + tileSize - eyeOffset - eyeSize;
        }
        
        ctx.fillRect(leftEyeX, leftEyeY, eyeSize, eyeSize);
        ctx.fillRect(rightEyeX, rightEyeY, eyeSize, eyeSize);
      }
      
      // 绘制食物
      ctx.save();
      const foodX = food.x * tileSize + tileSize / 2;
      const foodY = food.y * tileSize + tileSize / 2;
      const foodSize = tileSize * (0.7 + Math.sin(foodAnimAngle) * 0.1);
      
      // 添加光晕效果
      ctx.shadowColor = colors.food.glow;
      ctx.shadowBlur = 15;
      
      // 绘制脉动的食物
      ctx.beginPath();
      ctx.arc(foodX, foodY, foodSize / 2, 0, Math.PI * 2);
      ctx.fillStyle = colors.food.fill;
      ctx.fill();
      
      ctx.strokeStyle = colors.food.border;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }
    
    // 绘制网格背景
    function drawGrid() {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 1;
      
      // 绘制垂直线
      for (let x = 0; x <= canvas.width; x += tileSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      
      // 绘制水平线
      for (let y = 0; y <= canvas.height; y += tileSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }
    
    // 游戏循环
    function gameLoop(currentTime) {
      // 计算时间差
      if (lastTime === 0) {
        lastTime = currentTime;
      }
      const deltaTime = currentTime - lastTime;
      lastTime = currentTime;
      
      // 更新累加器
      accumulator += deltaTime;
      
      // 更新游戏逻辑的固定时间步长
      const timeStep = 1000 / speed;
      
      // 只在累加器超过时间步长时更新逻辑
      if (accumulator >= timeStep) {
        if (!gameOver) {
          update();
        }
        accumulator -= timeStep;
      }
      
      // 绘制
      draw();
      
      // 请求下一帧
      requestAnimationFrame(gameLoop);
    }
    
    // 辅助函数：绘制圆角矩形
    function roundRect(ctx, x, y, width, height, radius, fill = true, stroke = false) {
      if (typeof radius === 'number') {
        radius = {tl: radius, tr: radius, br: radius, bl: radius};
      } else {
        radius = {...{tl: 0, tr: 0, br: 0, bl: 0}, ...radius};
      }
      ctx.beginPath();
      ctx.moveTo(x + radius.tl, y);
      ctx.lineTo(x + width - radius.tr, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius.tr);
      ctx.lineTo(x + width, y + height - radius.br);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius.br, y + height);
      ctx.lineTo(x + radius.bl, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius.bl);
      ctx.lineTo(x, y + radius.tl);
      ctx.quadraticCurveTo(x, y, x + radius.tl, y);
      ctx.closePath();
      if (fill) {
        ctx.fill();
      }
      if (stroke) {
        ctx.stroke();
      }
    }
    
    // 辅助函数：调整颜色深浅
    function shadeColor(color, percent) {
      let R = parseInt(color.substring(1, 3), 16);
      let G = parseInt(color.substring(3, 5), 16);
      let B = parseInt(color.substring(5, 7), 16);

      R = parseInt(R * (100 + percent) / 100);
      G = parseInt(G * (100 + percent) / 100);
      B = parseInt(B * (100 + percent) / 100);

      R = (R < 255) ? R : 255;  
      G = (G < 255) ? G : 255;  
      B = (B < 255) ? B : 255;  

      const RR = ((R.toString(16).length === 1) ? "0" + R.toString(16) : R.toString(16));
      const GG = ((G.toString(16).length === 1) ? "0" + G.toString(16) : G.toString(16));
      const BB = ((B.toString(16).length === 1) ? "0" + B.toString(16) : B.toString(16));

      return "#" + RR + GG + BB;
    }
    
    // 键盘事件处理
    canvas.addEventListener('keydown', function(event) {
      // 防止方向键滚动页面
      if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(event.code) > -1) {
        event.preventDefault();
      }
      
      // 游戏结束时按空格重新开始
      if (gameOver && event.key === ' ') {
        resetGame();
      }
      
      // 控制蛇移动方向
      handleDirection(event.key);
    });
    
    // 处理方向控制
    function handleDirection(key) {
      // 只有当蛇在移动时才阻止反向移动
      if (velocityX !== 0 || velocityY !== 0) {
        // 左箭头或A
        if ((key === 'ArrowLeft' || key.toLowerCase() === 'a') && velocityX !== 1) {
          velocityX = -1;
          velocityY = 0;
        }
        // 右箭头或D
        else if ((key === 'ArrowRight' || key.toLowerCase() === 'd') && velocityX !== -1) {
          velocityX = 1;
          velocityY = 0;
        }
        // 上箭头或W
        else if ((key === 'ArrowUp' || key.toLowerCase() === 'w') && velocityY !== 1) {
          velocityX = 0;
          velocityY = -1;
        }
        // 下箭头或S
        else if ((key === 'ArrowDown' || key.toLowerCase() === 's') && velocityY !== -1) {
          velocityX = 0;
          velocityY = 1;
        }
      } else {
        // 游戏开始前可以任意设置方向
        if (key === 'ArrowLeft' || key.toLowerCase() === 'a') {
          velocityX = -1;
          velocityY = 0;
        } else if (key === 'ArrowRight' || key.toLowerCase() === 'd') {
          velocityX = 1;
          velocityY = 0;
        } else if (key === 'ArrowUp' || key.toLowerCase() === 'w') {
          velocityX = 0;
          velocityY = -1;
        } else if (key === 'ArrowDown' || key.toLowerCase() === 's') {
          velocityX = 0;
          velocityY = 1;
        }
      }
    }
    
    // 重置游戏
    function resetGame() {
      gameOver = false;
      snake = [{ x: 10, y: 10 }];
      velocityX = 1;  // 默认向右移动
      velocityY = 0;
      score = 0;
      speed = 10;
      scoreElement.textContent = score;
      gameOverScreen.style.display = 'none';
      placeFood();
    }
    
    // 添加重启按钮点击事件
    restartBtn.addEventListener('click', resetGame);
    
    // 添加触摸控制支持
    let touchStartX = 0;
    let touchStartY = 0;
    
    document.addEventListener('touchstart', function(event) {
      touchStartX = event.touches[0].clientX;
      touchStartY = event.touches[0].clientY;
    }, false);
    
    document.addEventListener('touchmove', function(event) {
      event.preventDefault();
    }, false);
    
    document.addEventListener('touchend', function(event) {
      if (gameOver) {
        resetGame();
        return;
      }
      
      const touchEndX = event.changedTouches[0].clientX;
      const touchEndY = event.changedTouches[0].clientY;
      
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;
      
      // 判断滑动方向
      if (Math.abs(deltaX) > Math.abs(deltaY)) {
        // 水平滑动
        if (deltaX > 0 && velocityX !== -1) {
          // 向右滑
          handleDirection('ArrowRight');
        } else if (deltaX < 0 && velocityX !== 1) {
          // 向左滑
          handleDirection('ArrowLeft');
        }
      } else {
        // 垂直滑动
        if (deltaY > 0 && velocityY !== -1) {
          // 向下滑
          handleDirection('ArrowDown');
        } else if (deltaY < 0 && velocityY !== 1) {
          // 向上滑
          handleDirection('ArrowUp');
        }
      }
    }, false);
    
    // 开始游戏
    placeFood();
    
    // 游戏加载完成后自动设置焦点到画布上
    window.addEventListener('load', function() {
      // 设置canvas可获取焦点
      canvas.tabIndex = 1;
      // 自动获取焦点
      canvas.focus();
      
      // 当点击document任何区域时，将焦点重新设置到canvas
      document.addEventListener('click', function() {
        canvas.focus();
      });
      
      // 当触摸屏幕时，将焦点设置到canvas
      document.addEventListener('touchstart', function() {
        canvas.focus();
      });
      
      // 3秒后自动隐藏提示
      setTimeout(function() {
        const startTip = document.getElementById('gameStartTip');
        if (startTip) {
          startTip.style.display = 'none';
        }
      }, 3000);
    });
    
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
