<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>记忆配对游戏</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f2f5;
      font-family: Arial, sans-serif;
    }
    .game-container {
      max-width: 600px;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .score, .time, .moves {
      font-size: 20px;
      font-weight: bold;
      color: #1890ff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: 10px;
      margin-bottom: 20px;
    }
    .card {
      aspect-ratio: 1/1;
      background-color: #1890ff;
      border-radius: 5px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 2em;
      font-weight: bold;
      color: white;
      transform-style: preserve-3d;
      transition: transform 0.5s;
      position: relative;
    }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 5px;
    }
    .card-front {
      background-color: #1890ff;
    }
    .card-back {
      background-color: white;
      transform: rotateY(180deg);
      border: 2px solid #1890ff;
      box-sizing: border-box;
    }
    .card.flipped {
      transform: rotateY(180deg);
    }
    .card.matched .card-back {
      background-color: #52c41a;
      color: white;
    }
    .start-screen, .end-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 10;
    }
    .button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #1890ff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    .button:hover {
      background-color: #40a9ff;
    }
    .title {
      font-size: 36px;
      margin-bottom: 20px;
    }
    .results {
      font-size: 18px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="stats">
      <div class="score">分数: <span id="score">0</span></div>
      <div class="time">时间: <span id="time">0</span></div>
      <div class="moves">翻牌: <span id="moves">0</span></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="start-screen" id="startScreen">
    <h1 class="title">记忆配对游戏</h1>
    <p>配对所有卡片以获得最高分数!</p>
    <button class="button" id="startButton">开始游戏</button>
  </div>

  <div class="end-screen" id="endScreen" style="display: none;">
    <h1 class="title">游戏结束</h1>
    <p class="results">你的分数: <span id="finalScore">0</span></p>
    <p class="results">用时: <span id="finalTime">0</span> 秒</p>
    <p class="results">翻牌次数: <span id="finalMoves">0</span></p>
    <button class="button" id="restartButton">再玩一次</button>
  </div>

  <script>
    // 游戏元素
    const grid = document.getElementById('grid');
    const scoreElement = document.getElementById('score');
    const timeElement = document.getElementById('time');
    const movesElement = document.getElementById('moves');
    const startScreen = document.getElementById('startScreen');
    const endScreen = document.getElementById('endScreen');
    const startButton = document.getElementById('startButton');
    const restartButton = document.getElementById('restartButton');
    const finalScoreElement = document.getElementById('finalScore');
    const finalTimeElement = document.getElementById('finalTime');
    const finalMovesElement = document.getElementById('finalMoves');

    // 游戏变量
    let cards = [];
    let flippedCards = [];
    let score = 0;
    let moves = 0;
    let gameTime = 0;
    let timer = null;
    let matchedPairs = 0;
    let totalPairs = 8;
    let canFlip = false;

    // 表情符号数组，用作卡片内容
    const emojis = ['🐱', '🐶', '🐼', '🦊', '🐸', '🦄', '🐢', '🦁'];

    // 初始化游戏
    function initGame() {
      // 重置游戏状态
      cards = [];
      flippedCards = [];
      score = 0;
      moves = 0;
      gameTime = 0;
      matchedPairs = 0;
      canFlip = true;
      
      // 更新显示
      scoreElement.textContent = score;
      timeElement.textContent = gameTime;
      movesElement.textContent = moves;
      
      // 清空网格
      grid.innerHTML = '';
      
      // 创建卡片对
      const cardPairs = [...emojis, ...emojis];
      
      // 洗牌
      shuffleArray(cardPairs);
      
      // 创建卡片元素
      cardPairs.forEach((emoji, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = index;
        card.dataset.value = emoji;
        
        const cardFront = document.createElement('div');
        cardFront.className = 'card-front';
        cardFront.textContent = '?';
        
        const cardBack = document.createElement('div');
        cardBack.className = 'card-back';
        cardBack.textContent = emoji;
        
        card.appendChild(cardFront);
        card.appendChild(cardBack);
        
        card.addEventListener('click', () => flipCard(card));
        
        grid.appendChild(card);
        cards.push(card);
      });
      
      // 开始计时器
      if (timer) {
        clearInterval(timer);
      }
      timer = setInterval(() => {
        gameTime++;
        timeElement.textContent = gameTime;
      }, 1000);
    }

    // 卡片翻转
    function flipCard(card) {
      // 如果已经匹配或已经翻开，或者当前已有两张翻开的卡片，则不允许翻转
      if (
        !canFlip ||
        card.classList.contains('matched') || 
        card.classList.contains('flipped') || 
        flippedCards.length >= 2
      ) {
        return;
      }
      
      // 翻转卡片
      card.classList.add('flipped');
      flippedCards.push(card);
      
      // 记录动作
      moves++;
      movesElement.textContent = moves;
      
      // 如果翻开了两张卡片，检查是否匹配
      if (flippedCards.length === 2) {
        canFlip = false;
        const [card1, card2] = flippedCards;
        
        if (card1.dataset.value === card2.dataset.value) {
          // 匹配成功
          setTimeout(() => {
            card1.classList.add('matched');
            card2.classList.add('matched');
            flippedCards = [];
            canFlip = true;
            
            // 增加分数
            score += 10;
            scoreElement.textContent = score;
            
            // 匹配对数增加
            matchedPairs++;
            
            // 检查游戏是否结束
            if (matchedPairs === totalPairs) {
              endGame();
            }
          }, 500);
        } else {
          // 匹配失败
          setTimeout(() => {
            card1.classList.remove('flipped');
            card2.classList.remove('flipped');
            flippedCards = [];
            canFlip = true;
            
            // 扣分
            score = Math.max(0, score - 1);
            scoreElement.textContent = score;
          }, 1000);
        }
      }
    }

    // 结束游戏
    function endGame() {
      clearInterval(timer);
      
      // 计算最终得分
      const timeBonus = Math.max(0, 300 - gameTime); // 时间越短奖励越多
      const movesPenalty = Math.max(0, moves - totalPairs * 2) * 0.5; // 移动次数越多惩罚越大
      const finalScore = score + timeBonus - movesPenalty;
      
      // 显示结果
      finalScoreElement.textContent = Math.round(finalScore);
      finalTimeElement.textContent = gameTime;
      finalMovesElement.textContent = moves;
      
      // 显示结束屏幕
      endScreen.style.display = 'flex';
    }

    // 洗牌函数
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // 事件监听
    startButton.addEventListener('click', () => {
      startScreen.style.display = 'none';
      initGame();
    });

    restartButton.addEventListener('click', () => {
      endScreen.style.display = 'none';
      initGame();
    });
  </script>
</body>
</html>
