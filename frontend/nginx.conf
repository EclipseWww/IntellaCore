# 配置 nginx 服务器
# 
# ============ Windows Docker Desktop 说明 ============
# Windows Docker Desktop 不支持 host 网络模式
# 必须使用 bridge 模式，通过 Docker 内部网络访问后端
#
# 真实IP获取说明：
# - Windows Docker Desktop 的 bridge 模式下，$remote_addr 是 Docker 网桥 IP
# - 真实客户端 IP 需要通过上游代理或前端传递
# - 在内网机房环境中，可以依赖前端传递的 X-Client-Real-IP 头
# ===================================================

# 设置真实IP变量
# 优先使用上游传递的 X-Forwarded-For，否则使用 $remote_addr
map $http_x_forwarded_for $real_client_ip {
    default $remote_addr;
    "~^(?<first_ip>[^,]+)" $first_ip;
}

server {
    listen 80 default_server;
    server_name _;  # 使用通配符，接受所有域名和IP地址
    root /usr/share/nginx/html;
    index index.html;
    
    # 增加客户端请求体大小限制，解决413错误
    client_max_body_size 500M;
    
    # 添加CORS头
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Client-Real-IP';
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';

    # 全局超时设置
    send_timeout 600s;

    # HTML must be revalidated after deployment; missing bundles must not return HTML.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 添加对上传媒体文件的代理
    location /public/media/ {
        proxy_pass http://backend:5003/public/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 适用于图片和视频的设置
        proxy_buffering off;
        proxy_cache_bypass $http_pragma;
        expires off;
    }

    location /api {
        proxy_pass http://backend:5003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        
        # ========== 真实客户端IP传递配置 ==========
        # 使用计算后的真实IP（优先从上游X-Forwarded-For获取）
        proxy_set_header X-Real-IP $real_client_ip;
        
        # 追加代理链
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 透传前端自定义的客户端IP头（重要：这是Windows Docker下获取真实IP的主要方式）
        proxy_set_header X-Client-Real-IP $http_x_client_real_ip;
        
        # 其他代理头
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # ========================================
        
        proxy_cache_bypass $http_upgrade;
        
        # 增加超时时间，支持大文件上传和下载
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        
        # 增加缓冲区设置
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # 禁用请求体缓冲，适用于大文件上传
        proxy_request_buffering off;
    }
}
