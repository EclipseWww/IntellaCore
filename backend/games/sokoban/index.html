<!doctype html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="Keywords" content="关键词">
		<meta name="Description" content="描述">
		<title>推箱</title>
		<style>
		*{
			margin:0px;
			padding:0px;
		}
		body{
			overflow:hidden;
			background-color:#333;
			color:#ddd;
		}
		.banner{
			
		}
		#msg{
			padding:10px;
			position:absolute;
			left:60px;
			max-width:608px;
			color:#999;
		}
		.game{
			top:50px;
			width:640px;
			margin:10px auto;
			text-align:center;
			position:absolute;
			left:50px;
		}
		.move{
			top:50px;
			width:220px;
			margin:10px auto;
			position:absolute;
			left:750px;
			background-color:#333;
			color:#999;
			padding:10px;
			height:590px;
			box-shadow:0px 0px 4px #ddd;
			overflow-x:hidden;
		}
		
		#btntool{
			position:absolute;
			left:740px;	
		}

		.button {
			background-color: #565b55;
			color: #999;
			padding: 4px 4px;
			margin:10px;
			text-align: center;
			text-decoration: none;
			box-shadow: 2px 2px 2px #333;
		}
		.button:hover {
			background-color: #768b75; /* Green */
			color: #fff;
		}
		
		/*定义滚动条高宽及背景 高宽分别对应横竖滚动条的尺寸*/
		::-webkit-scrollbar
		{
			width: 10px;
			height: 10px;
			background-color: #585858;
		}
		 
		/*定义滚动条轨道 内阴影+圆角*/
		::-webkit-scrollbar-track
		{
			background-color: #333;
		}
		 
		/*定义滑块 内阴影+圆角*/
		::-webkit-scrollbar-thumb
		{
			-webkit-box-shadow: inset 0 0 6px rgba(0,0,0,.3);
			background-color: #222;
		}
		
		</style>
	</head>
	<body onkeydown="doKeyDown(event)" onunload="flushSave()"><!--身体-->
	<div id="main" >
		<div class="banner">
			<div id="msg"></div>
			<div id="btntool">
				<input type="button" class="button" value="撤消一步" onclick="undo()">
				<input type="button" class="button" value="重新开始" onclick="restart()">
				<input type="button" class="button" value="上一关" onclick="gotoLevel(iCurlevel-1)">
				<input type="button" class="button" value="下一关" onclick="gotoLevel(iCurlevel+1)">
				<input type="button" class="button"  value="游戏说明" onclick="showHelp()">		
			</div>
		</div>
		<div class="game">
			<canvas id="canvas" class="canvas" width="608" height="608"></canvas>
		</div>
		<div id="move" class="move"> 
		移动记录：
		</div>
		<audio id="myaudio" src="sound/music.ogg" controls="controls" autoplay loop="true" hidden="true" ></audio>		
		<audio id="audio" controls="controls"  hidden="true" ></audio>
	</div>	
	</body>
	<script src="js/mapdata100.js"></script>
	<script>
		var tip=document.getElementById("move");
		var can = document.getElementById("canvas");
		var msg = document.getElementById("msg");
		var cxt = can.getContext("2d");
		var w = 38,h = 38;
		var TOTAL = levels.length;
		var curMap, curLevel, curMan;
		var iCurlevel = 0;      // 当前关（从0开始）
		var moveTimes = 0;      // 当前关已走步数
		var moveLog = [];       // 当前关的移动记录
		var undoStack = [];       // 撤消用：每步之前的地图与小人朝向
		var begin = false;
		var ready = false;      // 存档读取完成后才允许操作
		var showhelp = false;
		// 每个用户自己的存档（服务器保存）：level=当前关，best[关]=最少步数
		var progress = { level: 0, best: {} };

		var oImgs = {
			"block" : "images/block.png", "wall" : "images/wall.png", "box" : "images/box.png", "ball" : "images/ball.png",
			"up" : "images/up.png", "down" : "images/down.png", "left" : "images/left.png", "right" : "images/right.png"
		};
		function imgPreload(srcs,callback){
			var count = 0,imgNum = 0,images = {};
			for (var k in srcs) imgNum++;
			for (var k in srcs) {
				images[k] = new Image();
				images[k].onload = function(){ if (++count >= imgNum) callback(images); };
				images[k].src = srcs[k];
			}
		}
		var block,wall,box,ball,up,down,left,right;
		imgPreload(oImgs,function(images){
			block = images.block; wall = images.wall; box = images.box; ball = images.ball;
			up = images.up; down = images.down; left = images.left; right = images.right;
			init();
		});

		// ---------- 存档 ----------
		var saveTimer = null;
		function flushSave(){
			if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
			if (window.GameSave) GameSave.save(progress);
		}
		function saveProgress(){
			if (!window.GameSave) return;
			if (saveTimer) clearTimeout(saveTimer);
			saveTimer = setTimeout(flushSave, 400);
		}
		function normalizeSave(d){
			var p = { level: 0, best: {} };
			if (d && typeof d === 'object') {
				var l = parseInt(d.level, 10);
				if (l >= 0) p.level = Math.min(l, TOTAL - 1);
				if (d.best && typeof d.best === 'object') p.best = d.best;
			}
			return p;
		}

		function init(){
			msg.innerHTML = "正在读取你的游戏进度…";
			var p = window.GameSave ? GameSave.load() : Promise.resolve(null);
			p.then(function(d){
				progress = normalizeSave(d);
				ready = true;
				loadLevel(progress.level);
			});
		}

		function InitMap(){
			for (var i=0;i<18;i++) for (var j=0;j<18;j++) cxt.drawImage(block,w*j,h*i,w,h);
		}
		function Point(x,y){ this.x = x; this.y = y; }
		var perPosition = new Point(5,5);
		function DrawMap(level){
			for (var i=0;i<level.length;i++) {
				for (var j=0;j<level[i].length;j++) {
					var pic = block;
					switch (level[i][j]) {
					case 1: pic = wall; break;
					case 2: pic = ball; break;
					case 3: pic = box; break;
					case 4: pic = curMan; perPosition.x = i; perPosition.y = j; break;
					case 5: pic = box; break;
					}
					cxt.drawImage(pic,w*j-(pic.width-w)/2,h*i-(pic.height-h),pic.width,pic.height);
				}
			}
		}
		function redraw(){ InitMap(); DrawMap(curMap); }

		function loadLevel(n){
			iCurlevel = Math.max(0, Math.min(TOTAL - 1, n));
			curMap = copyArray(levels[iCurlevel]);
			curLevel = levels[iCurlevel];
			curMan = down;
			moveTimes = 0; moveLog = []; undoStack = [];
			redraw();
			showMoveInfo();
			showTable();
		}
		function gotoLevel(n){
			if (!ready) return;
			if (n < 0 || n > TOTAL - 1) return;
			loadLevel(n);
			progress.level = iCurlevel; saveProgress();
		}
		function restart(){ if (ready) { loadLevel(iCurlevel); notice('cancel'); } }

		function undo(){
			if (!ready || !undoStack.length) return;
			var last = undoStack.pop();
			curMap = last.map; curMan = last.man;
			moveLog.pop(); moveTimes--;
			redraw(); showMoveInfo(); showTable();
			notice('cancel');
		}

		function showTable(){
			var html = "第" + (iCurlevel+1) + "关 移动记录：";
			for (var i=0;i<moveLog.length;i++) html += "<br>" + (i+1) + "：" + moveLog[i];
			tip.innerHTML = html;
			tip.scrollTop = tip.scrollHeight;
		}

		function notice(n) {
			var audio = document.getElementById("audio");
			var files = { tui:'tui.ogg', pop:'pop.ogg', pass:'pass.ogg', zou:'zou.ogg', ok:'ok.ogg', cancel:'cancel.ogg' };
			if (!files[n]) return;
			audio.src = 'sound/' + files[n];
			var p = audio.play();
			if (p && p.catch) p.catch(function(){});
		}
		function voicePlay(){ var p = document.getElementById("myaudio").play(); if (p && p.catch) p.catch(function(){}); }

		function go(dir){
			if (!ready) return;
			var p1,p2;
			var before = { map: copyArray(curMap), man: curMan };
			switch (dir) {
			case "up":    curMan = up;    p1 = new Point(perPosition.x-1,perPosition.y); p2 = new Point(perPosition.x-2,perPosition.y); break;
			case "down":  curMan = down;  p1 = new Point(perPosition.x+1,perPosition.y); p2 = new Point(perPosition.x+2,perPosition.y); break;
			case "left":  curMan = left;  p1 = new Point(perPosition.x,perPosition.y-1); p2 = new Point(perPosition.x,perPosition.y-2); break;
			case "right": curMan = right; p1 = new Point(perPosition.x,perPosition.y+1); p2 = new Point(perPosition.x,perPosition.y+2); break;
			default: return;
			}
			var moved = Trygo(p1,p2);
			if (moved) {
				undoStack.push(before);
				moveTimes++;
				moveLog.push(dir);
				showMoveInfo();
				showTable();
			}
			redraw();
			if (moved && checkFinish()) setTimeout(passLevel, 0);
		}

		function checkFinish(){
			for (var i=0;i<curMap.length;i++)
				for (var j=0;j<curMap[i].length;j++)
					if (curLevel[i][j] == 2 && curMap[i][j] != 3 || curLevel[i][j] == 5 && curMap[i][j] == 2) return false;
			return true;
		}

		function Trygo(p1,p2){
			if (!begin) { begin = true; voicePlay(); }
			if (p1.x<0 || p1.y<0 || p1.x>=curMap.length || p1.y>=curMap[0].length) return false;
			if (curMap[p1.x][p1.y]==1) { notice('pop'); return false; }
			if (curMap[p1.x][p1.y]==3 || curMap[p1.x][p1.y]==5) {
				if (p2.x<0 || p2.y<0 || p2.x>=curMap.length || p2.y>=curMap[0].length) { notice('pop'); return false; }
				var f = curMap[p2.x][p2.y];
				if (f==1 || f==3 || f==5) { notice('pop'); return false; }
				// 箱子前进一格；原来箱子在目标点上的，格子变回目标点
				curMap[p2.x][p2.y] = 3;
				notice((curLevel[p2.x][p2.y]==2 || curLevel[p2.x][p2.y]==5) ? 'ok' : 'tui');
			} else {
				notice('zou');
			}
			curMap[p1.x][p1.y] = 4;
			var v = curLevel[perPosition.x][perPosition.y];
			if (v!=2) { v = (v==5) ? 2 : 0; }
			curMap[perPosition.x][perPosition.y] = v;
			perPosition = p1;
			return true;
		}

		function passLevel(){
			notice('pass');
			var key = String(iCurlevel);
			if (!progress.best[key] || moveTimes < progress.best[key]) progress.best[key] = moveTimes;
			if (iCurlevel >= TOTAL - 1) {
				progress.level = TOTAL - 1; flushSave();
				msg.innerHTML = "🎉 恭喜！" + TOTAL + " 关全部通关！";
				return;
			}
			progress.level = iCurlevel + 1;
			flushSave();
			loadLevel(progress.level);
			msg.innerHTML = "恭喜过关！第 " + (iCurlevel+1) + "/" + TOTAL + " 关";
		}

		function doKeyDown(event){
			switch (event.keyCode) {
			case 37: case 65: event.preventDefault(); go("left"); break;
			case 38: case 87: event.preventDefault(); go("up"); break;
			case 39: case 68: event.preventDefault(); go("right"); break;
			case 40: case 83: event.preventDefault(); go("down"); break;
			case 90: undo(); break; // Z
			case 82: restart(); break; // R
			}
		}

		function showMoveInfo(){
			var best = progress.best[String(iCurlevel)];
			msg.innerHTML = "第" + (iCurlevel+1) + "/" + TOTAL + "关 移动次数: " + moveTimes + (best ? "　本关最好成绩: " + best + " 步" : "");
		}
		function showHelp(){
			showhelp = !showhelp;
			if (showhelp) msg.innerHTML = "方向键或 WASD 移动小人，把箱子全部推到小球的位置即可过关。箱子只能推不能拉，一次只能推一个。Z 撤消一步，R 重新开始。进度会自动保存。";
			else showMoveInfo();
		}
		function copyArray(arr){
			var b=[];
			for (var i=0;i<arr.length;i++) b[i] = arr[i].concat();
			return b;
		}
	</script>
</html>
